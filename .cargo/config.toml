# Windows: whisper-rs-sys bindgen needs MSVC + Windows SDK headers.
# Without these, bindgen falls back to Linux stubs and whisper-rs fails to compile.
[env]
LIBCLANG_PATH = { value = "C:\\Program Files\\LLVM\\bin", force = true }
BINDGEN_EXTRA_CLANG_ARGS = { value = "-target x86_64-pc-windows-msvc -I\"C:\\Program Files (x86)\\Windows Kits\\10\\Include\\10.0.26100.0\\ucrt\" -I\"C:\\Program Files (x86)\\Windows Kits\\10\\Include\\10.0.26100.0\\um\" -I\"C:\\Program Files (x86)\\Windows Kits\\10\\Include\\10.0.26100.0\\shared\" -I\"C:\\Program Files\\Microsoft Visual Studio\\18\\Professional\\VC\\Tools\\MSVC\\14.51.36231\\include\" -I\"C:\\Program Files\\LLVM\\lib\\clang\\22\\include\"", force = true }
