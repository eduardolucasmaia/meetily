# Windows: whisper-rs-sys bindgen needs MSVC + Windows SDK headers.
# Without these, bindgen falls back to Linux stubs and whisper-rs fails to compile.
[env]
LIBCLANG_PATH = { value = "C:\\Program Files\\LLVM\\bin", force = true }
# Let vcvars64 supply MSVC/SDK; extra -I paths made bindgen emit broken opaque whisper structs.
BINDGEN_EXTRA_CLANG_ARGS = { value = "-target x86_64-pc-windows-msvc -x c", force = true }
